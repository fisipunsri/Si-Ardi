<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Digital Pegawai</title>

    <link rel="icon" href="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" type="image/png">
    
    <style>
        /* Mengatur agar halaman tidak memiliki jarak dan memenuhi layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah double scrollbar */
            font-family: Arial, sans-serif;
        }

        /* Memaksa iframe tampil penuh tanpa garis tepi */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Gaya visual untuk container loader */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* Animasi spinner loading sederhana */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Container Loader (agar tidak kosong putih saat Apps Script memuat) -->
    <div id="loader-container">
        <div class="spinner"></div>
    </div>

    <!-- Iframe Google Apps Script -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzmvTWx9m4onBGetocfUgux-D9_QKDD3PNWABdKCv0OlEUfID7IZhGwy6VOrKCOcWtNGg/exec" 
        allow="autoplay"
        onload="
            var loader = document.getElementById('loader-container');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(function(){ 
                    loader.style.visibility = 'hidden'; 
                    loader.style.display = 'none'; 
                }, 500);
            }
        " 
        allowfullscreen>
    </iframe>

</body>
</html>
