<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Si Ardi Pegawai</title>

    <link rel="icon" href="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp" type="image/png">
    
    <style>
        /* Mengatur agar halaman tidak memiliki jarak dan memenuhi layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah double scrollbar */
            font-family: Arial, sans-serif;
        }

        /* Memaksa iframe tampil penuh tanpa garis tepi */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Gaya visual untuk container loader */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* Area logo + riak gelombang */
        .logo-wave {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Riak gelombang yang menyebar dari belakang logo */
        .logo-wave .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110px;
            height: 110px;
            margin: -55px 0 0 -55px;
            border-radius: 50%;
            border: 2px solid rgba(22, 93, 255, 0.45);
            opacity: 0;
            animation: ripple 3.6s cubic-bezier(0.16, 0.6, 0.3, 1) infinite;
        }
        .logo-wave .ring:nth-child(2) { animation-delay: 1.2s; }
        .logo-wave .ring:nth-child(3) { animation-delay: 2.4s; }

        @keyframes ripple {
            0%   { transform: scale(0.8); opacity: 0; }
            15%  { opacity: 0.8; }
            100% { transform: scale(2.1); opacity: 0; }
        }

        /* Logo melayang bergelombang (naik-turun + miring tipis) */
        .logo-wave img {
            position: relative;
            z-index: 2;
            width: 110px;
            height: 110px;
            object-fit: contain;
            animation: floatWave 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 14px rgba(22, 93, 255, 0.25));
        }

        @keyframes floatWave {
            0%   { transform: translateY(0) rotate(0deg); }
            25%  { transform: translateY(-12px) rotate(-2deg); }
            50%  { transform: translateY(0) rotate(0deg); }
            75%  { transform: translateY(12px) rotate(2deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-wave .ring, .logo-wave img { animation: none; }
            .logo-wave .ring { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Container Loader (agar tidak kosong putih saat Apps Script memuat) -->
    <div id="loader-container">
        <div class="logo-wave">
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <img src="https://lh3.googleusercontent.com/d/1y7uSeQTv9gfPLRiTM7yYbW74Cpv6DXJp=s256" alt="Memuat...">
        </div>
    </div>

    <!-- Iframe Google Apps Script -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzmvTWx9m4onBGetocfUgux-D9_QKDD3PNWABdKCv0OlEUfID7IZhGwy6VOrKCOcWtNGg/exec" 
        allow="autoplay"
        onload="
            var loader = document.getElementById('loader-container');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(function(){ 
                    loader.style.visibility = 'hidden'; 
                    loader.style.display = 'none'; 
                }, 500);
            }
        " 
        allowfullscreen>
    </iframe>

</body>
</html>
